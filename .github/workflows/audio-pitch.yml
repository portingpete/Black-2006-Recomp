name: Audio pitch regression

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  apu-pitch:
    name: APU pitch / Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path third_party -Force | Out-Null
          git clone https://github.com/sp00nznet/xboxrecomp.git third_party/xboxrecomp
          if ($LASTEXITCODE -ne 0) { throw 'Runtime clone failed' }
          git -C third_party/xboxrecomp checkout --detach 766ecefcd7fb2a9b344de8ec891f6fe9ea14261b
          if ($LASTEXITCODE -ne 0) { throw 'Pinned checkout failed' }
          git -C third_party/xboxrecomp apply --check "$PWD/patches/xboxrecomp.patch"
          if ($LASTEXITCODE -ne 0) { throw 'Runtime patch preflight failed' }
          git -C third_party/xboxrecomp apply "$PWD/patches/xboxrecomp.patch"
          if ($LASTEXITCODE -ne 0) { throw 'Runtime patch failed' }
      - name: Build APU library
        shell: pwsh
        run: |
          cmake -S third_party/xboxrecomp -B build-runtime -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Runtime configure failed' }
          cmake --build build-runtime --config Release --target xbox_apu
          if ($LASTEXITCODE -ne 0) { throw 'APU build failed' }
      - name: Build and run regression
        shell: pwsh
        run: |
          cmake -S tests/apu_pitch -B build-apu-pitch -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Test configure failed' }
          foreach ($configuration in 'Release', 'Debug') {
            cmake --build build-apu-pitch --config $configuration
            if ($LASTEXITCODE -ne 0) { throw "$configuration test build failed" }
            ctest --test-dir build-apu-pitch -C $configuration --output-on-failure
            if ($LASTEXITCODE -ne 0) { throw "$configuration regression failed" }
          }
